name: Build NOVA APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NOVA_LAUNCHER_ALPHA_0_2.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
      - run: gradle assembleDebug --no-daemon
        working-directory: NOVA_LAUNCHER_ALPHA_0_2
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-debug-apk
          path: NOVA_LAUNCHER_ALPHA_0_2/app/build/outputs/apk/debug/*.apk
